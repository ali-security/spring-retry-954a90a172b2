language: java
jdk:
  - openjdk8
sudo: required
cache:
  directories:
    - $HOME/.m2
install: true
before_script: travis_wait 45 ./mvnw install -q -U -DskipTests=true -Dmaven.javadoc.skip=true -Dgpg.skip=true -Dmaven.test.redirectTestOutputToFile=true
script: ./mvnw install -B -nsu -Pstrict -Dmaven.javadoc.skip=true -Dgpg.skip=true -Dmaven.test.redirectTestOutputToFile=true
