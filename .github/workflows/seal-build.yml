name: seal-build
on:
  workflow_dispatch: {}
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build jar (tests run on Travis)
        run: ./mvnw -B -V -e -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true package
      - uses: actions/upload-artifact@v4
        with:
          name: spring-retry-jar
          path: target/spring-retry-1.2.4.RELEASE.jar
          if-no-files-found: error
